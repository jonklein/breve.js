<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // A soft gate for the hosted preview (anywhere but a local machine): a placeholder until the project is public, not security.
      (function () {
        var k = 'breve.pass', pass = 'spiderland'
        try { if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || localStorage.getItem(k) === pass) return } catch (e) { return }
        document.open()
        document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>breve</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1226;color:#d8e0ee;font:16px system-ui,sans-serif}form{display:grid;gap:12px;text-align:center}input,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #3a4658;background:#121928;color:inherit}button{cursor:pointer;background:#4da3ff;color:#06101f;border:0}</style><form><div>breve is in development.</div><input type="password" name="p" placeholder="password" autofocus autocomplete="off"><button>Enter</button></form><script>document.forms[0].onsubmit=function(e){e.preventDefault();if(this.p.value==="' + pass + '"){try{localStorage.setItem("' + k + '",this.p.value)}catch(x){}location.reload()}else{this.p.value="";this.p.placeholder="not quite"}}<\/script>')
        document.close()
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>breve gallery</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/site.css" />
  </head>
  <body>
    <header class="site-header"><nav id="site-nav" class="site-nav" aria-label="Site"></nav></header>
    <div class="page">
      <section class="hero" style="padding-bottom: 8px">
        <h1>Gallery</h1>
        <p>Every example, ready to run. Open one to watch it and change it, or fork it to start your own.</p>
      </section>
      <div id="filters" class="filters" role="group" aria-label="Filter by tag"></div>
      <div id="cards"></div>
      <h2 id="mine-title" class="hidden">Your projects</h2>
      <p id="mine-note" class="lede hidden">These live in this browser only. Use Share in the workbench to get a link that carries one.</p>
      <div id="mine" class="cards"></div>
    </div>
    <footer class="site-footer">breve · <a href="https://github.com/jonklein/breve.js" target="_blank" rel="noopener">source</a></footer>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
