server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off; # behind Fly's proxy the port in a redirect would be the internal one

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

  # pages and the example files can change on every deploy
  add_header Cache-Control "no-cache" always;

  # built scripts, styles and wasm have a hash in their name, so they never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # the assistant and docs need the local server (packages/server), which this site does not run: say so quickly
  location /api/ {
    default_type application/json;
    return 404 '{"error":"the assistant is only available when running the workbench locally"}';
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
