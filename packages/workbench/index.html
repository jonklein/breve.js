<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>breve workbench</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <strong>breve</strong>
      <select id="project" aria-label="Project"></select>
      <input id="name" class="hidden" aria-label="Project name" />
      <button id="fork" title="Copy this project so you can change it freely">Fork</button>
      <button id="delete" class="hidden" title="Delete this project">Delete</button>
      <span class="spacer"></span>
      <button id="play" title="Play or pause">Pause</button>
      <button id="step" title="Advance one tick">Step</button>
      <button id="reset" title="Restart from the seed">Reset</button>
      <button id="sweep" title="Run many copies of this scene side by side, each with a different value of one param">Sweep</button>
      <span id="stats" class="muted mono"></span>
      <button id="restore" title="Discard your edits and reload the example">Restore example</button>
    </header>
    <main>
      <section id="editors">
        <nav>
          <button class="tab active" data-tab="scene">scene.json</button>
          <button class="tab" data-tab="script" id="script-tab">script.js</button>
          <button class="tab" data-tab="experiment">experiment.json</button>
          <button class="tab" data-tab="chat">Assistant</button>
          <button class="tab" data-tab="docs">Docs</button>
          <span id="status" class="status ok">ok</span>
        </nav>
        <div id="editor-scene" class="editor"></div>
        <div id="editor-script" class="editor hidden"></div>
        <div id="exp" class="exp hidden">
          <div id="editor-experiment" class="editor"></div>
          <div class="exp-bar">
            <button id="exp-run" title="Run every candidate to the end, one after another, and rank them">Run</button>
            <button id="exp-watch" title="Show up to 12 of the runs side by side, live">Watch</button>
            <button id="exp-stop" disabled>Stop</button>
            <button id="exp-apply" disabled title="Put the best run's params into scene.json">Apply best</button>
            <button id="exp-csv" disabled>Export CSV</button>
            <span id="exp-status" class="muted mono"></span>
          </div>
          <div id="exp-results" class="exp-results"></div>
        </div>
        <div id="chat" class="chat hidden"></div>
        <div id="docs" class="docs hidden"></div>
        <ul id="problems" class="problems"></ul>
      </section>
      <section id="right">
        <div id="sweepbar" class="hidden">
          <span class="muted">Watching the experiment's runs side by side. Click one to continue from it.</span>
          <button id="sweep-exit">Back to one run</button>
        </div>
        <div id="thinkbar" class="hidden">
          <span class="muted">Thinking</span>
          <select id="think-mode" title="Realtime never makes the sim wait for a model; lockstep waits for every answer, so a run repeats exactly">
            <option value="realtime">realtime</option>
            <option value="lockstep">lockstep (repeatable)</option>
          </select>
          <span id="think-count" class="muted mono"></span>
          <button id="think-save" title="Download every decision made so far">Save log</button>
          <button id="think-replay" title="Pick a saved log: the run restarts and plays those decisions back without asking the model">Replay log…</button>
          <input id="think-file" type="file" accept=".json,application/json" class="hidden" />
        </div>
        <div id="viewport"></div>
        <div id="inspector" class="inspector hidden"></div>
        <div id="tiles" class="hidden"></div>
        <div id="panel">
          <div id="params"></div>
          <div id="metrics"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
